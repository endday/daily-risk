name = "daily-risk-worker"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# 路由配置：daily-risk.endday.top/api/* 请求转发到 Worker
routes = [
  { pattern = "daily-risk.endday.top/api/*", zone_name = "endday.top" },
  { pattern = "daily-risk.endday.top/admin/*", zone_name = "endday.top" },
  { pattern = "daily-risk.endday.top/health", zone_name = "endday.top" }
]

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "daily-risk"
database_id = "e2772393-32af-42f2-aa2d-800d3b1b816f"
remote = true

# Cron Triggers
[triggers]
crons = [
  "0 10 * * *",   # 北京时间 18:00，收盘后同步日线与每日数据
  "15 10 * * *",  # 北京时间 18:15，独立同步行业资金流
  "30 * * * *",   # 每小时 :30 分，更新实际值（只拉 FRED）
]

# 环境变量（通过 wrangler secret put 设置）
# FRED_API_KEY
# BLS_API_KEY
# ALPHA_VANTAGE_KEY
# ADMIN_TOKEN
